name: backend-ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kosto_vet_test
          POSTGRES_USER: kosto_vet
          POSTGRES_PASSWORD: kosto_vet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kosto_vet -d kosto_vet_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://kosto_vet:kosto_vet@localhost:5432/kosto_vet_test
      FIXED_DELIVERY_PRICE_MINOR: 50000
      ROBOKASSA_MODE: sandbox
      ROBOKASSA_MERCHANT_LOGIN: demo
      ROBOKASSA_PASSWORD1: password-one
      ROBOKASSA_PASSWORD2: password-two
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
          python-version: "3.14"
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run openapi-spec-validator contracts/openapi.v1.yaml
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run bandit -q -r src
      - run: uv run pip-audit

  image:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kostovet-backend
          tags: |
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/kostovet-backend@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
