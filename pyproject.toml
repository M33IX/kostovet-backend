[project]
name = "kostovet-backend"
version = "0.1.0"
description = "Kosto-Vet demo backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "cryptography>=45.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "prometheus-client>=0.22.0",
  "pillow>=11.3.0",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.41",
  "structlog>=25.4.0",
  "tenacity>=9.1.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "hypothesis>=6.135.0",
  "mypy>=1.17.0",
  "openapi-spec-validator>=0.7.2",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
  "testcontainers[postgres]>=4.10.0",
]

[project.scripts]
kosto-vet = "kosto_vet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosto_vet"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = [
  "ASYNC240", # CLI performs bounded local file IO around blocking boto3 calls.
  "B008",     # FastAPI dependency markers intentionally live in defaults.
  "E501",     # Ruff formatter owns line wrapping; long URLs/signatures are left intact.
  "S101",     # Assertions are used for internal invariants and tests.
  "S105",     # OAuth token endpoint URLs are not credentials.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["postgres: requires an isolated PostgreSQL database"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
packages = ["kosto_vet"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["kosto_vet"]

[tool.coverage.report]
fail_under = 0
show_missing = true
