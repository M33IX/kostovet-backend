openapi: 3.1.0
info:
  title: Kosto-Vet API
  version: 0.5.0
  description: Demo-release API contract for the FastAPI backend. Every operation explicitly declares its access class. Disabled future capabilities return FEATURE_DISABLED and do not imitate success.
  license:
    name: Proprietary
servers:
  - url: https://api.kosto-vet.ru
    description: Production API
  - url: http://localhost:8000
    description: Local FastAPI
tags:
  - name: Health
    description: Liveness and readiness endpoints.
  - name: Catalog
    description: Public product catalog and search.
  - name: Settings
    description: Public non-secret storefront configuration.
  - name: Leads
    description: Contact, urgent, and stock notification requests.
  - name: Orders
    description: B2B and B2C order workflows.
  - name: Payments
    description: Robokassa payment attempts and callbacks.
  - name: Customer Auth
    description: Password and Yandex ID authentication.
  - name: Account
    description: Customer profile, manager, and order history.
  - name: Cart
    description: Persistent customer and guest carts.
  - name: Favorites
    description: Customer saved products.
  - name: Media
    description: Product media read models. Manager upload is outside the demo release.
  - name: Admin Auth
    description: Staff authentication and sessions.
  - name: Admin
    description: Manager and administrator operations.
  - name: Integrations
    description: Integration state and manual recovery operations.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Service can accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Required dependency or database migration is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/catalog/categories:
    get:
      tags: [Catalog]
      summary: Get the published category tree
      operationId: listCategories
      security: []
      responses:
        "200":
          description: Root categories with recursively nested children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTreeResponse"

  /api/v1/catalog/categories/{slug}:
    get:
      tags: [Catalog]
      summary: Get one published category with ancestors and its subtree
      operationId: getCategory
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: Category, ordered ancestors, and recursively nested published descendants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/settings/public:
    get:
      tags: [Settings]
      summary: Get public storefront settings
      operationId: getPublicSettings
      security: []
      responses:
        "200":
          description: Public non-secret settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /api/v1/catalog/products:
    get:
      tags: [Catalog]
      summary: List products
      operationId: listProducts
      security: []
      parameters:
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/IncludeDescendants"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: in_stock
          in: query
          schema:
            type: boolean
        - name: stock_state
          in: query
          schema:
            $ref: "#/components/schemas/StockState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [popular, price_asc, price_desc, name_asc, stock_desc]
            default: popular
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "404":
          description: The requested category does not exist or is not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/catalog/products/{slug}:
    get:
      tags: [Catalog]
      summary: Get product detail
      operationId: getProduct
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/search-suggestions:
    get:
      tags: [Catalog]
      summary: Get search suggestions
      operationId: getSearchSuggestions
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchSuggestion"

  /api/v1/leads:
    post:
      tags: [Leads]
      summary: Create contact/request lead
      operationId: createLead
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
      responses:
        "202":
          description: Lead accepted and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/stock-subscriptions:
    post:
      tags: [Leads]
      summary: Store a back-in-stock request; delivery is disabled in demo
      operationId: createStockSubscription
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockSubscriptionRequest"
      responses:
        "202":
          description: Request persisted locally; no automatic notification is promised in demo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/orders/quote:
    post:
      tags: [Orders]
      summary: Create local B2B request without invoice or stock reservation
      operationId: createQuoteOrder
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteOrderRequest"
      responses:
        "202":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAcceptedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Stock conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/orders/checkout:
    post:
      tags: [Orders]
      summary: Create B2C checkout and payment
      operationId: createCheckoutOrder
      security:
        - CustomerSession: []
          CsrfToken: []
        - {}
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutOrderRequest"
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Stock conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Robokassa sandbox initialization failed after local order creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stock data, delivery configuration, or sandbox payment capability is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{public_id}:
    get:
      tags: [Orders]
      summary: Get public order status by signed access token header
      operationId: getPublicOrder
      security:
        - OrderAccessToken: []
      parameters:
        - name: public_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrder"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders/{public_id}/payment-attempts:
    post:
      tags: [Orders, Payments]
      summary: Create a new Robokassa payment attempt for an unpaid order
      operationId: createOrderPaymentAttempt
      security:
        - OrderAccessToken: []
      parameters:
        - name: public_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentAttemptRequest"
      responses:
        "201":
          description: A new payment attempt was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "409":
          description: Order is already paid, canceled, stale, or has an active attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/customer/auth/register:
    post:
      tags: [Customer Auth]
      summary: Register customer account
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterRequest"
      responses:
        "201":
          description: Customer session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/customer/auth/login:
    post:
      tags: [Customer Auth]
      summary: Customer login
      operationId: loginCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
      responses:
        "200":
          description: Customer session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/customer/auth/refresh:
    post:
      tags: [Customer Auth]
      summary: Refresh customer session
      operationId: refreshCustomerSession
      security:
        - CustomerRefreshSession: []
          CsrfToken: []
      responses:
        "200":
          description: Customer session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/customer/auth/csrf:
    get:
      tags: [Customer Auth]
      summary: Issue a session-bound customer CSRF token
      operationId: issueCustomerCsrfToken
      security:
        - CustomerRefreshSession: []
      responses:
        "200":
          description: CSRF token for subsequent unsafe customer requests
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/customer/auth/logout:
    post:
      tags: [Customer Auth]
      summary: Logout current customer
      operationId: logoutCustomer
      security:
        - CustomerRefreshSession: []
          CsrfToken: []
      responses:
        "204":
          description: Logged out

  /api/v1/customer/auth/yandex/start:
    get:
      tags: [Customer Auth]
      summary: Start Yandex ID OAuth login
      operationId: startYandexLogin
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            description: Relative frontend URL to return to after login.
      responses:
        "302":
          description: Redirect to Yandex OAuth authorize URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/customer/auth/yandex/callback:
    get:
      tags: [Customer Auth]
      summary: Complete Yandex ID OAuth login
      operationId: completeYandexLogin
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to frontend with customer session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
                format: uri-reference
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/customer/auth/yandex/link:
    post:
      tags: [Customer Auth]
      summary: Link Yandex ID to current customer
      operationId: linkYandexAccount
      security:
        - CustomerSession: []
          CsrfToken: []
      responses:
        "302":
          description: Redirect to Yandex OAuth authorize URL for account linking
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/customer/auth/yandex/unlink:
    delete:
      tags: [Customer Auth]
      summary: Unlink Yandex ID from current customer
      operationId: unlinkYandexAccount
      security:
        - CustomerSession: []
          CsrfToken: []
      responses:
        "204":
          description: Yandex ID unlinked
        "400":
          description: Cannot unlink the only login method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/customer/auth/password-reset/request:
    post:
      tags: [Customer Auth]
      summary: Password reset extension point, disabled in demo
      operationId: requestCustomerPasswordReset
      security: []
      x-release-status: disabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "503":
          $ref: "#/components/responses/FeatureDisabled"

  /api/v1/customer/auth/password-reset/confirm:
    post:
      tags: [Customer Auth]
      summary: Password reset confirmation extension point, disabled in demo
      operationId: confirmCustomerPasswordReset
      security: []
      x-release-status: disabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "503":
          $ref: "#/components/responses/FeatureDisabled"

  /api/v1/account/me:
    get:
      tags: [Account]
      summary: Get current customer account
      operationId: getCustomerMe
      security:
        - CustomerSession: []
      responses:
        "200":
          description: Customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Account]
      summary: Update current customer profile
      operationId: updateCustomerMe
      security:
        - CustomerSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerProfileRequest"
      responses:
        "200":
          description: Updated customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/manager:
    get:
      tags: [Account]
      summary: Get assigned personal manager
      operationId: getCustomerManager
      security:
        - CustomerSession: []
      responses:
        "200":
          description: Personal manager or default contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalManager"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/delivery-addresses:
    get:
      tags: [Account]
      summary: List saved delivery addresses of the current customer
      operationId: listCustomerDeliveryAddresses
      security:
        - CustomerSession: []
      responses:
        "200":
          description: Saved customer delivery addresses, default address first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddressListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Account]
      summary: Save a delivery address for the current customer
      operationId: createCustomerDeliveryAddress
      security:
        - CustomerSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryAddressRequest"
      responses:
        "201":
          description: Saved delivery address
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddress"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/delivery-addresses/{id}:
    patch:
      tags: [Account]
      summary: Update a saved delivery address
      operationId: updateCustomerDeliveryAddress
      security:
        - CustomerSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - $ref: "#/components/parameters/VersionIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryAddressRequest"
      responses:
        "200":
          description: Updated delivery address
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[0-9]+"$'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddress"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Address version conflict or no replacement default address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Account]
      summary: Delete a saved delivery address
      operationId: deleteCustomerDeliveryAddress
      security:
        - CustomerSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - $ref: "#/components/parameters/VersionIfMatch"
      responses:
        "204":
          description: Delivery address deleted; another address becomes default when available
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Address version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/account/orders:
    get:
      tags: [Account]
      summary: List customer order history
      operationId: listCustomerOrders
      security:
        - CustomerSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Customer order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/orders/{public_id}:
    get:
      tags: [Account]
      summary: Get customer order details
      operationId: getCustomerOrder
      security:
        - CustomerSession: []
      parameters:
        - name: public_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/account/cart:
    get:
      tags: [Cart]
      summary: Get current customer cart
      operationId: getCustomerCart
      security:
        - CustomerSession: []
      responses:
        "200":
          description: Customer cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/account/cart/items:
    put:
      tags: [Cart]
      summary: Add or replace a cart item
      operationId: upsertCustomerCartItem
      security:
        - CustomerSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/CartIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Cart version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/account/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCustomerCartItem
      security:
        - CustomerSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - $ref: "#/components/parameters/CartIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cart version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: deleteCustomerCartItem
      security:
        - CustomerSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - $ref: "#/components/parameters/CartIfMatch"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
