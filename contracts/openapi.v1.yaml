components:
  securitySchemes:
    CustomerSession:
      type: apiKey
      in: cookie
      name: kv_customer_access
      description: Short-lived customer access session. HttpOnly, Secure, SameSite=Lax.
    CustomerRefreshSession:
      type: apiKey
      in: cookie
      name: kv_customer_refresh
      description: Rotating customer refresh credential. Stored only as a hash server-side.
    AdminSession:
      type: apiKey
      in: cookie
      name: kv_access
      description: Short-lived staff access session with server-side role and permission checks.
    AdminRefreshSession:
      type: apiKey
      in: cookie
      name: kv_refresh
      description: Rotating staff refresh credential. Stored only as a hash server-side.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Signed session-bound CSRF token required together with cookie auth on unsafe methods.
    OrderAccessToken:
      type: apiKey
      in: header
      name: X-Order-Access-Token
      description: Signed opaque guest-order credential. Returned once, stored only as a hash, and never put in URLs or logs.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key. Reuse with a different body returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CategorySlug:
      name: category
      in: query
      description: Globally unique category slug. Omit to query the whole catalog.
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    IncludeDescendants:
      name: include_descendants
      in: query
      description: When category is set, include products assigned to every published descendant. Ignored when category is omitted.
      schema:
        type: boolean
        default: true
    UuidPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current cart ETag, for example `"7"`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    VersionIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current resource ETag, for example `"7"`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FeatureDisabled:
      description: Capability is intentionally disabled in the demo release
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            error:
              code: FEATURE_DISABLED
              message: This capability is not available in the demo release.
              request_id: req_01J00000000000000000000000
              retryable: false

  schemas:
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok:
          type: boolean
        version:
          type: string

    PublicSettings:
      type: object
      required: [fixed_delivery_price, stock_reservation_ttl_seconds, manager]
      properties:
        fixed_delivery_price:
          $ref: "#/components/schemas/Money"
        stock_reservation_ttl_seconds:
          type: integer
          const: 300
        manager:
          $ref: "#/components/schemas/PersonalManager"
        emergency_phone:
          type: [string, "null"]
        emergency_surcharge_percent:
          type: integer
          default: 10

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        meta:
          type: object
          additionalProperties: true

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    AcceptedResponse:
      type: object
      required: [ok, id]
      properties:
