      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTreeNode"

    CategoryTreeNode:
      type: object
      required:
        - id
        - slug
        - path
        - title
        - description
        - depth
        - is_leaf
        - direct_product_count
        - subtree_product_count
        - children
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        parent_slug:
          type: [string, "null"]
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        path:
          type: string
          description: Canonical navigation path assembled from ancestor slugs; it changes when the node is moved.
          example: plates/locking-plates
        title:
          type: string
        description:
          type: string
        depth:
          type: integer
          minimum: 0
        is_leaf:
          type: boolean
          description: True when the node has no published children.
        direct_product_count:
          type: integer
          minimum: 0
          description: Number of published products assigned directly to this category.
        subtree_product_count:
          type: integer
          minimum: 0
          description: Number of distinct published products in this category and its published descendants.
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTreeNode"
        seo:
          $ref: "#/components/schemas/SeoMeta"

