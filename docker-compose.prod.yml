services:
  caddy:
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:?required}
      API_HOST: ${API_HOST:?required}
      FRONTEND_UPSTREAM: frontend:3000
      API_UPSTREAM: api:8000
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:?required}

  frontend:
    image: ${FRONTEND_IMAGE:?required}

  api:
    image: ${BACKEND_IMAGE:?required}
    build: !reset null

  worker:
    image: ${BACKEND_IMAGE:?required}
    build: !reset null

  scheduler:
    image: ${BACKEND_IMAGE:?required}
    build: !reset null

  migrate:
    image: ${BACKEND_IMAGE:?required}
    build: !reset null

  backup:
    build: ./deploy/backup
    profiles: [backup]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?required}
      PGUSER: ${POSTGRES_USER:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?required}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?required}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?required}
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
